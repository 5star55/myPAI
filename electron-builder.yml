# Installer settings (npm run dist). Only the files listed under `files` are shipped, never .env.
# Users paste their own Nebius key in Settings → AI model. The one exception: a Tavily key is
# built into the code at build time so web search works out of the box (see electron.vite.config).
appId: com.pai.assistant
productName: pai
directories:
  output: dist
files:
  - out/**
  - skills/**
  - resources/**
  - native/bin/**
  - package.json
  # Belt and braces: no .env files, from anywhere (dependencies included), ever.
  - "!**/.env"
  - "!**/.env.*"
# A program inside the app archive can't be started, so the text helper is unpacked next to it.
asarUnpack:
  - native/bin/**
mac:
  category: public.app-category.productivity
  target: dmg
  # No Apple Developer ID yet: sign ad-hoc ("-") so the whole app is signed. Without it, a
  # downloaded copy is reported as "damaged" on Apple Silicon instead of "unverified developer".
  identity: "-"
  hardenedRuntime: false
  extendInfo:
    NSMicrophoneUsageDescription: pai listens when you use the mic or hands-free voice. Speech is turned into text on this computer.
win:
  target: nsis
nsis:
  artifactName: pai-${version}-setup.${ext}
